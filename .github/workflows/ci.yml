name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: ./mvnw -B verify
      - name: Dependency vulnerability report
        run: ./mvnw -B org.owasp:dependency-check-maven:check -DfailOnError=false -DautoUpdate=false -DfailBuildOnCVSS=11 || true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -t techstore-backend:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: techstore-backend:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
      - name: Trigger Render deployment after checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"; else echo "Render deploy hook is not configured."; fi
