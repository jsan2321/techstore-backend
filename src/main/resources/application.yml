spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: techstore
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
  # Disable in production for performance and security
    show-sql: true
    hibernate:
    # Avoid update in production; use migrations (Flyway/Liquibase)
      ddl-auto: update
    properties:
      hibernate:
      # Auto-detected usually
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false #true
            required: false #true

api:
  prefix: /api/v1

auth:
  token:
  # Access Token: 15 min... Security consideration: Short expiration increases security but requires frequent re-authentication
    expirationInMils: ${JWT_EXPIRATION}
    # CRITICAL: Use environment variable for JWT secret
    # Generate strong secret: openssl rand -base64 64
    # NEVER commit real secrets to version control
    jwtSecret: ${JWT_SECRET}
  refreshToken:
    # Refresh Token: 7 days - used to get new access tokens
    expirationInDays: ${REFRESH_TOKEN_EXPIRATION_DAYS}

app:
  admin:
    enabled: ${ADMIN_ENABLED}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    first-name: ${ADMIN_FIRST_NAME}
    last-name: ${ADMIN_LAST_NAME}
  frontend:
    base-url: http://localhost:${FRONTEND_BASE_PORT:4200}
  mail:
    from: ${MAIL_FROM}
    fail-on-error: false
  security:
    email-verification-token-expiration-hours: 24
    password-reset-token-expiration-minutes: 60
    email-confirmation-resend-cooldown-seconds: 60
    password-reset-request-cooldown-seconds: 60
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      token-info-base-url: https://oauth2.googleapis.com

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  secret: ${PAYPAL_SECRET}
  api-base-url: https://api-m.sandbox.paypal.com
  return-url: http://localhost:${FRONTEND_BASE_PORT:4200}/checkout/paypal/success
  cancel-url: http://localhost:${FRONTEND_BASE_PORT:4200}/checkout/paypal/cancel

# AWS S3 Configuration
aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION}
    bucket-name: ${AWS_S3_BUCKET_NAME}

# SpringDoc OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
    displayRequestDuration: true
    persistAuthorization: true
  show-actuator: false
  packages-to-scan: com.ecoapi.techstore
  paths-to-match: /api/**

server:
  port: 8081