spring:
  application:
    name: techstore
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

api:
  prefix: /api/v1

auth:
  token:
    expirationInMils: ${JWT_EXPIRATION:900000}
    jwtSecret: ${JWT_SECRET}
  refreshToken:
    expirationInDays: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  public-url: ${PUBLIC_APP_URL:${app.frontend.base-url}}
  admin:
    enabled: ${ADMIN_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:Admin}
    last-name: ${ADMIN_LAST_NAME:User}
  seed:
    demo-catalog: ${SEED_DEMO_CATALOG:false}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:no-reply@techstore.local}
    fail-on-error: ${MAIL_FAIL_ON_ERROR:true}
    resend-api-key: ${RESEND_API_KEY:}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    refresh-cookie:
      name: techstore_refresh
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      path: ${api.prefix}/auth
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:false}
      requests: ${RATE_LIMIT_REQUESTS:10}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      token-info-base-url: https://oauth2.googleapis.com

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION:auto}
    bucket-name: ${AWS_S3_BUCKET_NAME}
    endpoint: ${AWS_S3_ENDPOINT:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}

paypal:
  mode: ${PAYPAL_MODE:sandbox}
  client-id: ${PAYPAL_CLIENT_ID}
  secret: ${PAYPAL_SECRET}
  api-base-url: ${PAYPAL_API_BASE_URL:https://api-m.sandbox.paypal.com}
  return-url: ${PAYPAL_RETURN_URL:${app.public-url}/checkout/paypal/success}
  cancel-url: ${PAYPAL_CANCEL_URL:${app.public-url}/checkout/paypal/cancel}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  port: ${PORT:8080}
  shutdown: graceful

logging:
  pattern:
    console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n'

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:techstore-backend@dev}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
