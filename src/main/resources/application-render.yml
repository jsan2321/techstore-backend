spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL}

app:
  seed:
    demo-catalog: ${SEED_DEMO_CATALOG:true}
  mail:
    provider: resend
    fail-on-error: true
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    refresh-cookie:
      secure: true
      same-site: Lax
    rate-limit:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
